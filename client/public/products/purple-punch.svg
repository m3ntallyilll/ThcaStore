<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="purpleGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#7b1fa2;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4a148c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0d2e;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e1bee7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e24aa;stop-opacity:1" />
    </linearGradient>
    <filter id="purpleGlow" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8"/>
      <feColorMatrix type="saturate" values="1.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Main bud structure with purple hues -->
  <ellipse cx="200" cy="210" rx="100" ry="120" fill="url(#purpleGradient)"/>
  <ellipse cx="180" cy="190" rx="75" ry="90" fill="url(#purpleAccent)" opacity="0.6"/>
  <ellipse cx="220" cy="230" rx="80" ry="100" fill="url(#purpleGradient)" opacity="0.8"/>
  <ellipse cx="190" cy="250" rx="60" ry="75" fill="url(#purpleAccent)" opacity="0.4"/>
  
  <!-- Bright orange pistils -->
  <g stroke="#ff6f00" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M130 170 Q170 150 210 180" />
    <path d="M140 200 Q180 180 220 210" />
    <path d="M120 230 Q160 210 200 240" />
    <path d="M150 260 Q190 240 230 270" />
    <path d="M170 290 Q210 270 250 300" />
    <path d="M260 200 Q220 180 180 210" />
    <path d="M270 240 Q230 220 190 250" />
    <path d="M110 200 Q150 180 190 210" />
  </g>
  
  <!-- Sparkling trichomes -->
  <g filter="url(#purpleGlow)" opacity="0.85">
    <circle cx="170" cy="170" r="2.5" fill="#ffffff"/>
    <circle cx="190" cy="160" r="3" fill="#ffffff"/>
    <circle cx="210" cy="180" r="2.5" fill="#ffffff"/>
    <circle cx="230" cy="170" r="3" fill="#ffffff"/>
    <circle cx="160" cy="200" r="2.5" fill="#ffffff"/>
    <circle cx="240" cy="200" r="3" fill="#ffffff"/>
    <circle cx="180" cy="230" r="2.5" fill="#ffffff"/>
    <circle cx="220" cy="240" r="3" fill="#ffffff"/>
    <circle cx="150" cy="240" r="2.5" fill="#ffffff"/>
    <circle cx="250" cy="220" r="3" fill="#ffffff"/>
    <circle cx="170" cy="270" r="2.5" fill="#ffffff"/>
    <circle cx="210" cy="290" r="3" fill="#ffffff"/>
    <circle cx="190" cy="310" r="2.5" fill="#ffffff"/>
    <circle cx="140" cy="220" r="2.5" fill="#ffffff"/>
    <circle cx="260" cy="250" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Purple Punch label -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a0d2e">Purple Punch</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7b1fa2">Relaxing Indica</text>
</svg>