<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ogGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#558b2f;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#33691e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1b5e20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2818;stop-opacity:1" />
    </radialGradient>
    <filter id="kushEffect" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/>
      <feColorMatrix type="saturate" values="1.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Main bud structure - dense and compact for OG Kush -->
  <circle cx="200" cy="200" r="90" fill="url(#ogGradient)"/>
  <circle cx="170" cy="180" r="65" fill="url(#ogGradient)" opacity="0.9"/>
  <circle cx="230" cy="220" r="70" fill="url(#ogGradient)" opacity="0.8"/>
  <circle cx="190" cy="240" r="55" fill="url(#ogGradient)" opacity="0.7"/>
  <circle cx="220" cy="160" r="50" fill="url(#ogGradient)" opacity="0.6"/>
  
  <!-- Dark orange pistils -->
  <g stroke="#ff5722" stroke-width="2" fill="none" opacity="0.8">
    <path d="M140 160 Q180 140 220 170" />
    <path d="M150 190 Q190 170 230 200" />
    <path d="M130 220 Q170 200 210 230" />
    <path d="M160 250 Q200 230 240 260" />
    <path d="M180 280 Q220 260 260 290" />
    <path d="M120 180 Q160 160 200 190" />
    <path d="M250 180 Q210 160 170 190" />
    <path d="M270 220 Q230 200 190 230" />
  </g>
  
  <!-- Heavy trichome coverage -->
  <g filter="url(#kushEffect)" opacity="0.8">
    <circle cx="160" cy="160" r="3" fill="#ffffff"/>
    <circle cx="180" cy="150" r="2.5" fill="#ffffff"/>
    <circle cx="200" cy="140" r="3" fill="#ffffff"/>
    <circle cx="220" cy="160" r="2.5" fill="#ffffff"/>
    <circle cx="240" cy="150" r="3" fill="#ffffff"/>
    <circle cx="150" cy="180" r="2.5" fill="#ffffff"/>
    <circle cx="190" cy="170" r="3" fill="#ffffff"/>
    <circle cx="230" cy="180" r="2.5" fill="#ffffff"/>
    <circle cx="170" cy="200" r="3" fill="#ffffff"/>
    <circle cx="210" cy="190" r="2.5" fill="#ffffff"/>
    <circle cx="250" cy="200" r="3" fill="#ffffff"/>
    <circle cx="140" cy="200" r="2.5" fill="#ffffff"/>
    <circle cx="180" cy="220" r="3" fill="#ffffff"/>
    <circle cx="220" cy="210" r="2.5" fill="#ffffff"/>
    <circle cx="160" cy="240" r="3" fill="#ffffff"/>
    <circle cx="200" cy="250" r="2.5" fill="#ffffff"/>
    <circle cx="240" cy="240" r="3" fill="#ffffff"/>
    <circle cx="190" cy="280" r="2.5" fill="#ffffff"/>
    <circle cx="230" cy="270" r="3" fill="#ffffff"/>
  </g>
  
  <!-- OG Kush label -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0d2818">OG Kush</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#33691e">Premium Indica</text>
</svg>