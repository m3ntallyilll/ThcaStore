<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sourGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#cddc39;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#9e9d24;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#689f38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#33691e;stop-opacity:1" />
    </radialGradient>
    <filter id="diesel" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4"/>
      <feColorMatrix type="saturate" values="1.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Main bud structure - elongated for Sour Diesel -->
  <ellipse cx="200" cy="200" rx="70" ry="130" fill="url(#sourGradient)" transform="rotate(10 200 200)"/>
  <ellipse cx="190" cy="180" rx="50" ry="100" fill="url(#sourGradient)" transform="rotate(15 190 180)" opacity="0.9"/>
  <ellipse cx="210" cy="220" rx="60" ry="110" fill="url(#sourGradient)" transform="rotate(5 210 220)" opacity="0.8"/>
  <ellipse cx="180" cy="240" rx="45" ry="85" fill="url(#sourGradient)" transform="rotate(20 180 240)" opacity="0.7"/>
  
  <!-- Yellow-orange pistils -->
  <g stroke="#ffc107" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M160 150 Q200 130 240 160" />
    <path d="M150 180 Q190 160 230 190" />
    <path d="M170 210 Q210 190 250 220" />
    <path d="M160 240 Q200 220 240 250" />
    <path d="M180 270 Q220 250 260 280" />
    <path d="M150 300 Q190 280 230 310" />
    <path d="M270 200 Q230 180 190 210" />
    <path d="M140 220 Q180 200 220 230" />
  </g>
  
  <!-- Crystalline trichomes -->
  <g filter="url(#diesel)" opacity="0.75">
    <circle cx="175" cy="160" r="2" fill="#ffffff"/>
    <circle cx="195" cy="150" r="2.5" fill="#ffffff"/>
    <circle cx="215" cy="170" r="2" fill="#ffffff"/>
    <circle cx="165" cy="190" r="2.5" fill="#ffffff"/>
    <circle cx="225" cy="190" r="2" fill="#ffffff"/>
    <circle cx="185" cy="220" r="2.5" fill="#ffffff"/>
    <circle cx="205" cy="240" r="2" fill="#ffffff"/>
    <circle cx="235" cy="210" r="2.5" fill="#ffffff"/>
    <circle cx="155" cy="250" r="2" fill="#ffffff"/>
    <circle cx="245" cy="240" r="2.5" fill="#ffffff"/>
    <circle cx="175" cy="280" r="2" fill="#ffffff"/>
    <circle cx="215" cy="290" r="2.5" fill="#ffffff"/>
    <circle cx="195" cy="310" r="2" fill="#ffffff"/>
    <circle cx="145" cy="200" r="2" fill="#ffffff"/>
    <circle cx="255" cy="180" r="2.5" fill="#ffffff"/>
  </g>
  
  <!-- Sour Diesel label -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#33691e">Sour Diesel</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9e9d24">Classic Sativa</text>
</svg>