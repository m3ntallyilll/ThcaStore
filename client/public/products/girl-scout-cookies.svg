<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="gscGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#8bc34a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#689f38;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#388e3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="purpleHints" cx="60%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4a148c;stop-opacity:0.6" />
    </radialGradient>
    <filter id="hybridEffect" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
      <feColorMatrix type="saturate" values="1.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Main bud structure with green and purple mix -->
  <ellipse cx="200" cy="200" rx="95" ry="115" fill="url(#gscGradient)"/>
  <ellipse cx="180" cy="180" rx="70" ry="85" fill="url(#purpleHints)"/>
  <ellipse cx="220" cy="220" rx="75" ry="95" fill="url(#gscGradient)" opacity="0.9"/>
  <ellipse cx="190" cy="240" rx="60" ry="75" fill="url(#purpleHints)" opacity="0.7"/>
  <ellipse cx="210" cy="160" rx="55" ry="70" fill="url(#gscGradient)" opacity="0.8"/>
  
  <!-- Vibrant orange pistils -->
  <g stroke="#ff6f00" stroke-width="2.2" fill="none" opacity="0.9">
    <path d="M130 160 Q170 140 210 170" />
    <path d="M140 190 Q180 170 220 200" />
    <path d="M120 220 Q160 200 200 230" />
    <path d="M150 250 Q190 230 230 260" />
    <path d="M170 280 Q210 260 250 290" />
    <path d="M270 180 Q230 160 190 190" />
    <path d="M280 220 Q240 200 200 230" />
    <path d="M110 190 Q150 170 190 200" />
  </g>
  
  <!-- Balanced trichome coverage -->
  <g filter="url(#hybridEffect)" opacity="0.8">
    <circle cx="160" cy="160" r="2.8" fill="#ffffff"/>
    <circle cx="180" cy="150" r="2.5" fill="#ffffff"/>
    <circle cx="200" cy="140" r="2.8" fill="#ffffff"/>
    <circle cx="220" cy="160" r="2.5" fill="#ffffff"/>
    <circle cx="240" cy="150" r="2.8" fill="#ffffff"/>
    <circle cx="150" cy="190" r="2.5" fill="#ffffff"/>
    <circle cx="190" cy="180" r="2.8" fill="#ffffff"/>
    <circle cx="230" cy="190" r="2.5" fill="#ffffff"/>
    <circle cx="170" cy="220" r="2.8" fill="#ffffff"/>
    <circle cx="210" cy="210" r="2.5" fill="#ffffff"/>
    <circle cx="250" cy="220" r="2.8" fill="#ffffff"/>
    <circle cx="140" cy="230" r="2.5" fill="#ffffff"/>
    <circle cx="180" cy="250" r="2.8" fill="#ffffff"/>
    <circle cx="220" cy="240" r="2.5" fill="#ffffff"/>
    <circle cx="160" cy="280" r="2.8" fill="#ffffff"/>
    <circle cx="200" cy="290" r="2.5" fill="#ffffff"/>
    <circle cx="240" cy="280" r="2.8" fill="#ffffff"/>
  </g>
  
  <!-- Girl Scout Cookies label -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1b5e20">Girl Scout Cookies</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#689f38">Balanced Hybrid</text>
</svg>