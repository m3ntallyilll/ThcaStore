<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blueGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#a7c957;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#6a994e;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#386641;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5016;stop-opacity:1" />
    </radialGradient>
    <filter id="trichomes" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
      <feColorMatrix type="saturate" values="1.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Main bud structure -->
  <ellipse cx="200" cy="220" rx="120" ry="140" fill="url(#blueGradient)" transform="rotate(-15 200 220)"/>
  <ellipse cx="180" cy="200" rx="80" ry="100" fill="url(#blueGradient)" transform="rotate(-20 180 200)"/>
  <ellipse cx="220" cy="240" rx="90" ry="110" fill="url(#blueGradient)" transform="rotate(-10 220 240)"/>
  
  <!-- Orange pistils/hairs -->
  <g stroke="#ff6b35" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M150 180 Q200 160 250 190" />
    <path d="M160 200 Q210 180 260 210" />
    <path d="M140 220 Q190 200 240 230" />
    <path d="M170 240 Q220 220 270 250" />
    <path d="M155 260 Q205 240 255 270" />
    <path d="M180 280 Q230 260 280 290" />
    <path d="M145 300 Q195 280 245 310" />
  </g>
  
  <!-- Trichomes effect -->
  <g filter="url(#trichomes)" opacity="0.6">
    <circle cx="160" cy="180" r="2" fill="#ffffff"/>
    <circle cx="180" cy="190" r="1.5" fill="#ffffff"/>
    <circle cx="200" cy="170" r="2" fill="#ffffff"/>
    <circle cx="220" cy="200" r="1.5" fill="#ffffff"/>
    <circle cx="240" cy="180" r="2" fill="#ffffff"/>
    <circle cx="170" cy="220" r="1.5" fill="#ffffff"/>
    <circle cx="210" cy="240" r="2" fill="#ffffff"/>
    <circle cx="250" cy="220" r="1.5" fill="#ffffff"/>
    <circle cx="190" cy="260" r="2" fill="#ffffff"/>
    <circle cx="230" cy="280" r="1.5" fill="#ffffff"/>
    <circle cx="160" cy="240" r="1.5" fill="#ffffff"/>
    <circle cx="270" cy="240" r="2" fill="#ffffff"/>
    <circle cx="140" cy="200" r="1.5" fill="#ffffff"/>
    <circle cx="260" cy="260" r="2" fill="#ffffff"/>
    <circle cx="180" cy="300" r="1.5" fill="#ffffff"/>
  </g>
  
  <!-- Blue Dream label -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2d5016">Blue Dream</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6a994e">Premium THCA Flower</text>
</svg>