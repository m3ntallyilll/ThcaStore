<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5f5dc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6e6da;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flowerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8bc34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#689f38;stop-opacity:1" />
    </linearGradient>
    <filter id="infusedGlow" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
      <feColorMatrix type="saturate" values="1.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Pre-roll paper -->
  <rect x="120" y="80" width="160" height="240" rx="15" ry="15" fill="url(#paperGradient)" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Flower content visible through paper -->
  <rect x="130" y="90" width="140" height="220" rx="10" ry="10" fill="url(#flowerGradient)" opacity="0.7"/>
  
  <!-- Live resin infusion indicators -->
  <g filter="url(#infusedGlow)" opacity="0.8">
    <circle cx="150" cy="120" r="4" fill="#ffd700"/>
    <circle cx="180" cy="140" r="3" fill="#ffd700"/>
    <circle cx="220" cy="160" r="4" fill="#ffd700"/>
    <circle cx="160" cy="180" r="3" fill="#ffd700"/>
    <circle cx="240" cy="200" r="4" fill="#ffd700"/>
    <circle cx="170" cy="220" r="3" fill="#ffd700"/>
    <circle cx="210" cy="240" r="4" fill="#ffd700"/>
    <circle cx="190" cy="260" r="3" fill="#ffd700"/>
    <circle cx="230" cy="280" r="4" fill="#ffd700"/>
    <circle cx="160" cy="300" r="3" fill="#ffd700"/>
  </g>
  
  <!-- Twist at the tip -->
  <ellipse cx="200" cy="80" rx="15" ry="8" fill="url(#paperGradient)" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Crutch/filter -->
  <rect x="140" y="315" width="120" height="15" rx="5" ry="5" fill="#8d6e63" stroke="#5d4037" stroke-width="1"/>
  
  <!-- Premium labeling -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2e7d32">Infused Pre-Roll</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#689f38">Live Resin Enhanced</text>
</svg>