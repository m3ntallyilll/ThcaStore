<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="greenGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#8bc34a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#689f38;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e7d32;stop-opacity:1" />
    </radialGradient>
    <filter id="sparkle" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.3"/>
      <feColorMatrix type="saturate" values="1.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Main bud structure - more angular for Green Crack -->
  <polygon points="200,120 160,180 140,240 180,300 220,320 260,280 280,220 240,160" fill="url(#greenGradient)"/>
  <polygon points="190,140 170,190 160,240 190,280 210,290 240,260 250,210 220,170" fill="url(#greenGradient)" opacity="0.8"/>
  <polygon points="210,130 190,180 180,230 200,270 230,280 250,250 260,200 230,160" fill="url(#greenGradient)" opacity="0.9"/>
  
  <!-- Bright orange pistils -->
  <g stroke="#ff9800" stroke-width="2" fill="none" opacity="0.9">
    <path d="M160 170 Q200 150 240 180" />
    <path d="M150 200 Q190 180 230 210" />
    <path d="M170 230 Q210 210 250 240" />
    <path d="M160 260 Q200 240 240 270" />
    <path d="M180 290 Q220 270 260 300" />
    <path d="M140 190 Q180 170 220 200" />
    <path d="M270 230 Q230 210 190 240" />
  </g>
  
  <!-- Dense trichomes -->
  <g filter="url(#sparkle)" opacity="0.7">
    <circle cx="170" cy="170" r="2.5" fill="#ffffff"/>
    <circle cx="190" cy="160" r="2" fill="#ffffff"/>
    <circle cx="210" cy="180" r="2.5" fill="#ffffff"/>
    <circle cx="230" cy="170" r="2" fill="#ffffff"/>
    <circle cx="180" cy="200" r="2.5" fill="#ffffff"/>
    <circle cx="220" cy="210" r="2" fill="#ffffff"/>
    <circle cx="200" cy="230" r="2.5" fill="#ffffff"/>
    <circle cx="240" cy="220" r="2" fill="#ffffff"/>
    <circle cx="160" cy="220" r="2" fill="#ffffff"/>
    <circle cx="250" cy="190" r="2.5" fill="#ffffff"/>
    <circle cx="175" cy="250" r="2" fill="#ffffff"/>
    <circle cx="225" cy="260" r="2.5" fill="#ffffff"/>
    <circle cx="195" cy="280" r="2" fill="#ffffff"/>
    <circle cx="245" cy="270" r="2.5" fill="#ffffff"/>
    <circle cx="165" cy="290" r="2" fill="#ffffff"/>
  </g>
  
  <!-- Green Crack label -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">Green Crack</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#689f38">Energizing Sativa</text>
</svg>