<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cleanPaper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f8f8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="premiumFlower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#558b2f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#689f38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#f8f9fa"/>
  
  <!-- Pre-roll paper -->
  <rect x="120" y="80" width="160" height="240" rx="15" ry="15" fill="url(#cleanPaper)" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Premium flower content -->
  <rect x="130" y="90" width="140" height="220" rx="10" ry="10" fill="url(#premiumFlower)" opacity="0.6"/>
  
  <!-- Quality flower texture -->
  <g opacity="0.4">
    <circle cx="160" cy="120" r="3" fill="#2e7d32"/>
    <circle cx="190" cy="140" r="2" fill="#2e7d32"/>
    <circle cx="220" cy="160" r="3" fill="#2e7d32"/>
    <circle cx="170" cy="180" r="2" fill="#2e7d32"/>
    <circle cx="240" cy="200" r="3" fill="#2e7d32"/>
    <circle cx="180" cy="220" r="2" fill="#2e7d32"/>
    <circle cx="210" cy="240" r="3" fill="#2e7d32"/>
    <circle cx="200" cy="260" r="2" fill="#2e7d32"/>
    <circle cx="230" cy="280" r="3" fill="#2e7d32"/>
    <circle cx="170" cy="300" r="2" fill="#2e7d32"/>
  </g>
  
  <!-- Clean twist -->
  <ellipse cx="200" cy="80" rx="15" ry="8" fill="url(#cleanPaper)" stroke="#cccccc" stroke-width="1"/>
  
  <!-- Premium crutch -->
  <rect x="140" y="315" width="120" height="15" rx="5" ry="5" fill="#795548" stroke="#4e342e" stroke-width="1"/>
  
  <!-- Premium labeling -->
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2e7d32">Premium Pre-Roll</text>
  <text x="200" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#689f38">Premium Flower</text>
</svg>